<!DOCTYPE html>
<html lang="en" data-theme="3dslicer" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Slicer WebSub Workers</title>
  <link rel="icon" type="image/png" href="/static/images/3DSlicer-DesktopIcon.png">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    (function () {
      try {
        var mode = localStorage.getItem("websubWorkerControlColorMode");
        if (mode === "light" || mode === "dark") {
          document.documentElement.setAttribute("data-mode", mode);
        }
      } catch (_) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div class="container">
    <h1 class="page-header">
      <span class="header-brand">
        <img class="header-logo-slicer" src="/static/images/3DSlicer-DesktopIcon.png" alt="">
        <span class="header-title">3D Slicer WebSub Workers</span>
      </span>
      <span class="header-actions">
        <div class="hub-settings">
          <div class="hub-settings-header">
            <div class="hub-settings-stack">
              <button type="button" class="hub-settings-toggle" id="hubSettingsToggle"
                      aria-expanded="false" aria-controls="hubSettingsPanel" title="Settings">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.65-.07-.97l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.22-.08-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.97 0 .33.03.65.07.97l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65z"/>
                </svg>
              </button>
              <span class="header-meta" id="hubRuntimeMeta" aria-live="polite"></span>
            </div>
          </div>
          <div class="hub-settings-panel" id="hubSettingsPanel" hidden>
            <div class="hub-settings-row">
              <label for="color-mode">Theme</label>
              <select id="color-mode" aria-label="Theme">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
              </select>
            </div>
            <div class="hub-settings-row">
              <label for="hub-default">Default hub</label>
              <select id="hub-default" aria-label="Default hub target">
                <option value="local">Local (:2018)</option>
                <option value="cloud" selected>Cloud</option>
              </select>
            </div>
            <button type="button" id="refresh" class="hub-settings-launch">Refresh</button>
          </div>
        </div>
      </span>
    </h1>

    <div class="metrics-row" aria-label="Host metrics">
      <div class="metric-card" id="metricMemoryCard" title="Host memory">
        <div class="metric-card-body">
          <div class="metric-card-text">
            <h3>Memory</h3>
            <div class="metric-value" id="metricMemoryValue">—</div>
            <div class="metric-sub" id="metricMemorySub"></div>
          </div>
          <canvas id="metricMemoryChart" width="120" height="24" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="metric-card" id="metricCpuCard" title="Host CPU">
        <div class="metric-card-body">
          <div class="metric-card-text">
            <h3>CPU</h3>
            <div class="metric-value" id="metricCpuValue">—</div>
            <div class="metric-sub" id="metricCpuSub"></div>
          </div>
          <canvas id="metricCpuChart" width="120" height="24" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="metric-card" id="metricNetworkCard" title="Host network throughput">
        <div class="metric-card-body">
          <div class="metric-card-text">
            <h3>Network</h3>
            <div class="metric-value" id="metricNetworkValue">—</div>
            <div class="metric-sub" id="metricNetworkSub"></div>
          </div>
          <canvas id="metricNetworkChart" width="120" height="24" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="metric-card" id="metricGpuCard" title="GPU utilization">
        <div class="metric-card-body">
          <div class="metric-card-text">
            <h3>GPU</h3>
            <div class="metric-value" id="metricGpuValue">—</div>
            <div class="metric-sub" id="metricGpuSub"></div>
          </div>
          <canvas id="metricGpuChart" width="120" height="24" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="metric-card" id="metricDiskCard" title="Disk partition fill">
        <div class="metric-card-body">
          <div class="metric-card-text">
            <h3>Disk</h3>
            <div class="metric-value" id="metricDiskValue">—</div>
            <div class="metric-sub" id="metricDiskSub"></div>
          </div>
          <canvas id="metricDiskChart" width="120" height="24" aria-hidden="true"></canvas>
        </div>
      </div>
    </div>

    <div class="stats" id="global-stats" aria-label="Usage totals">
      <div class="stat-card" title="Completed and in-flight jobs recorded by workers">
        <h3>Total jobs</h3>
        <div class="value" id="statJobs">—</div>
      </div>
      <div class="stat-card" title="Total bytes downloaded into workers">
        <h3>GB in</h3>
        <div class="value" id="statGbIn">—</div>
      </div>
      <div class="stat-card" title="Total bytes published back through the hub">
        <h3>GB out</h3>
        <div class="value" id="statGbOut">—</div>
      </div>
      <div class="stat-card" title="Wall-clock job time on this host (download + inference), not device GPU/CPU counters">
        <h3>Compute time</h3>
        <div class="value" id="statCompute">—</div>
      </div>
    </div>

    <div id="error" class="banner error" hidden></div>
    <div id="products" class="products" aria-live="polite"></div>

    <section class="orchid-platform" id="orchid-platform" aria-label="Orchid radiology AI platform">
      <h2 class="orchid-platform-title">Orchid radiology AI platform</h2>
      <p class="orchid-platform-sub" id="orchidPlatformSub"></p>
      <div class="orchid-containers products" id="orchidContainers" aria-live="polite"></div>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
